<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greenden - Contact</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-white">

    <nav class="bg-green-100 p-4 flex justify-between items-center">

        <h1 class="text-2xl font-bold text-green-900">
            Greenden
        </h1>

        <ul class="flex gap-5 text-gray-700">
            <li><a href="index.html" class="hover:text-green-900">Home</a></li>
            <li><a href="products.html" class="hover:text-green-900">Products</a></li>
            <li><a href="contact.html" class="hover:text-green-900">Contact</a></li>
        </ul>

    </nav>

    <section class="text-center p-8">

        <h1 class="text-3xl font-bold text-green-900 mb-3">
            Contact Us
        </h1>

        <p class="text-gray-600">
            Have any questions? We would love to hear from you.
        </p>

    </section>

    <section class="max-w-xl mx-auto p-6">

        <form class="flex flex-col gap-4">

            <div>
                <label for="name" class="font-medium">Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                    class="border border-gray-400 p-3 w-full mt-2 rounded">
            </div>


            <div>
                <label for="email" class="font-medium">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    class="border border-gray-400 p-3 w-full mt-2 rounded">
            </div>


            <div>
                <label for="message" class="font-medium">Message</label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Enter your message"
                    required
                    class="border border-gray-400 p-3 w-full mt-2 rounded"></textarea>
            </div>


            <button
                type="submit"
                class="bg-green-900 text-white p-3 rounded hover:bg-green-700">
                Submit
            </button>

        </form>

    </section>

    <section class="text-center p-8 bg-green-50">

        <h2 class="text-2xl font-bold text-green-900 mb-4">
            Get In Touch
        </h2>

        <p class="text-gray-600 mb-2">
            Email: info@greenden.com
        </p>

        <p class="text-gray-600 mb-2">
            Phone: +91 98765 43210
        </p>

        <p class="text-gray-600">
            Address: Chennai, Tamil Nadu, India
        </p>

    </section>

    <footer class="bg-green-900 text-white p-6">

        <h2 class="text-2xl font-bold mb-3">
            Greenden
        </h2>

        <p class="mb-3">
            Bringing nature closer to your home.
        </p>

        <p class="text-sm">
            © 2026 Greenden. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
